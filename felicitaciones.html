<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>¡Abrieron la caja fuerte!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Figtree:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --boveda: #0e2630; --laton: #d9a53a; --claro: #e6f0f3; --suave: #93b1bc;
    --display: "Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
    --texto: "Figtree", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--boveda); color: var(--claro);
         font: 18px/1.6 var(--texto); text-align: center; overflow-x: hidden; }
  #confeti { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  main { position: relative; padding: 32px 20px; }
  .candado { width: min(240px, 56vw); overflow: visible; }
  .asa { transform-origin: 58px 118px; transition: transform 1s cubic-bezier(.3, 1.5, .5, 1); }
  .abierto .asa { transform: translateY(-8px) rotate(-30deg); }
  .tinte { fill: #1f9d68; opacity: 0; transition: opacity .6s; }
  .abierto .tinte { opacity: .4; }
  h1 { margin: 12px 0 6px; font: 800 clamp(38px, 8vw, 78px)/0.98 var(--display); letter-spacing: -0.03em; }
  .equipo { margin: 0 0 28px; color: var(--suave); font-size: 20px; }
  .acciones { display: flex; gap: 18px; justify-content: center; align-items: center; flex-wrap: wrap; }
  button { font: 600 17px var(--texto); border: 0; border-radius: 10px; padding: 12px 22px; cursor: pointer; background: var(--laton); color: #2b1c03; }
  button:hover { filter: brightness(1.06); }
  a { color: var(--claro); font-weight: 600; }
  button:focus-visible, a:focus-visible { outline: 3px solid var(--laton); outline-offset: 3px; }
  @media (prefers-reduced-motion: reduce) { .asa, .tinte { transition: none; } }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <linearGradient id="gAcero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef4f6"/><stop offset=".45" stop-color="#a3b7c0"/><stop offset="1" stop-color="#5b7480"/>
    </linearGradient>
    <linearGradient id="gLaton" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4cd69"/><stop offset=".55" stop-color="#d9a53a"/><stop offset="1" stop-color="#a06d16"/>
    </linearGradient>
  </defs>
</svg>
<canvas id="confeti" aria-hidden="true"></canvas>

<main id="escena">
  <svg class="candado" viewBox="0 -24 200 274" role="img" aria-label="Candado abierto">
    <ellipse cx="100" cy="240" rx="68" ry="8" fill="#000" opacity=".3"/>
    <g class="asa"><path d="M58 118V76a42 42 0 0 1 84 0v42" fill="none" stroke="url(#gAcero)" stroke-width="18" stroke-linecap="round"/></g>
    <rect x="28" y="112" width="144" height="120" rx="20" fill="url(#gLaton)"/>
    <rect x="37" y="121" width="126" height="102" rx="14" fill="none" stroke="#fff" stroke-opacity=".3" stroke-width="2"/>
    <path d="M44 126h112" stroke="#fff" stroke-opacity=".35" stroke-width="3" stroke-linecap="round"/>
    <circle cx="46" cy="214" r="3.5" fill="#7a520e"/><circle cx="154" cy="214" r="3.5" fill="#7a520e"/>
    <circle cx="100" cy="162" r="13" fill="#3a2706"/><path d="M93 168h14l4 30H89z" fill="#3a2706"/>
    <rect class="tinte" x="28" y="112" width="144" height="120" rx="20"/>
  </svg>
  <h1>¡Abrieron la caja fuerte!</h1>
  <p class="equipo" id="equipo"></p>
  <div class="acciones">
    <button id="mas" type="button">Tirar más confeti</button>
    <a id="volver" href="index.html">Volver a los ejercicios</a>
  </div>
</main>

<script>
(function () {
  var n = parseInt(new URLSearchParams(location.search).get('equipo'), 10);
  if (n > 0 && n < 100) {
    document.getElementById('equipo').textContent = 'Equipo ' + n;
    document.getElementById('volver').href = 'index.html?equipo=' + n;
  }

  var reducir = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var escena = document.getElementById('escena');
  setTimeout(function () { escena.classList.add('abierto'); }, reducir ? 0 : 250);
  if (reducir) { document.getElementById('mas').hidden = true; return; }

  // ---- confeti ----
  var cv = document.getElementById('confeti');
  var cx = cv.getContext('2d');
  var W = 0, H = 0, parts = [], corriendo = false;
  var colores = ['#d9a53a', '#f4cd69', '#1f9d68', '#3b8dff', '#ef5b8c', '#ffffff'];

  function medir() {
    var d = window.devicePixelRatio || 1;
    W = window.innerWidth; H = window.innerHeight;
    cv.width = W * d; cv.height = H * d;
    cx.setTransform(d, 0, 0, d, 0, 0);
  }
  window.addEventListener('resize', medir);
  medir();

  function rafaga(x, y, cuantos, abanico) {
    for (var i = 0; i < cuantos; i++) {
      var ang = -Math.PI / 2 + (Math.random() - 0.5) * abanico;
      var vel = 9 + Math.random() * 11;
      parts.push({
        x: x, y: y, vx: Math.cos(ang) * vel, vy: Math.sin(ang) * vel,
        w: 6 + Math.random() * 7, h: 4 + Math.random() * 6,
        r: Math.random() * 6.28, vr: (Math.random() - 0.5) * 0.4,
        c: colores[Math.floor(Math.random() * colores.length)],
        redondo: Math.random() < 0.25, vida: 0
      });
    }
    if (!corriendo) { corriendo = true; requestAnimationFrame(paso); }
  }

  function paso() {
    cx.clearRect(0, 0, W, H);
    for (var i = parts.length - 1; i >= 0; i--) {
      var p = parts[i];
      p.vy += 0.28; p.vx *= 0.99; p.vy *= 0.995;
      p.x += p.vx; p.y += p.vy; p.r += p.vr; p.vida++;
      if (p.y > H + 30 || p.vida > 420) { parts.splice(i, 1); continue; }
      cx.save();
      cx.globalAlpha = p.vida > 300 ? Math.max(0, 1 - (p.vida - 300) / 120) : 1;
      cx.translate(p.x, p.y);
      cx.rotate(p.r);
      cx.fillStyle = p.c;
      if (p.redondo) { cx.beginPath(); cx.arc(0, 0, p.w / 2, 0, 6.28); cx.fill(); }
      else { cx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); }
      cx.restore();
    }
    if (parts.length) requestAnimationFrame(paso);
    else { corriendo = false; cx.clearRect(0, 0, W, H); }
  }

  function granRafaga() {
    rafaga(W * 0.15, H, 90, 1.0);
    rafaga(W * 0.85, H, 90, 1.0);
    setTimeout(function () { rafaga(W * 0.5, H * 0.75, 130, 2.4); }, 450);
  }
  granRafaga();
  document.getElementById('mas').addEventListener('click', granRafaga);
})();
</script>
</body>
</html>
